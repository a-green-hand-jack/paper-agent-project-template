name: Feature
description: Propose a bounded product or development change
body:
  - type: markdown
    attributes:
      value: >-
        Follow `.agents/skills/shared/development-writing/SKILL.md` from the
        repository root. Explain the problem and intended result without relying
        on links. In the existing acceptance field, name the entrypoint,
        conditions and expected evidence, including when a real build or run
        is required. Use the project's writing language and redact private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and design
      description: What is in scope, and what is deliberately outside it?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What checks or real runs will establish completion?
    validations:
      required: true
